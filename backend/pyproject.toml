[project]
name = "docthecode"
version = "0.5.0"
description = "Documentation repos that stay in sync with GitHub pull requests"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
  "itsdangerous>=2.2",
  "github-copilot-sdk",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
